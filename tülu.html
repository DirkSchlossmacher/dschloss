<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ball in Glass Animation</title>
<style>
  body, html {
    margin: 0;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #eee;
  }
  canvas {
    border: 1px solid #000;
    background-color: #fff;
    touch-action: none;
  }
</style>
</head>
<body>

<canvas id="myCanvas" width="300" height="300"></canvas>

<script>
const canvas = document.getElementById('myCanvas');
const ctx = canvas.getContext('2d');
const centerX = canvas.width / 2;
const centerY = canvas.height / 2;
const radius = Math.min(centerX, centerY) * 0.9;
const ballRadius = 10;
let ballX = centerX;
let ballY = 0;
let dx = 0;
let dy = 2; // Gravity effect
let angle = (Math.random() * 30 - 15) * (Math.PI / 180); // Random angle between -15° and 15°

function drawBall() {
  ctx.beginPath();
  ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
  ctx.fillStyle = "#0095DD";
  ctx.fill();
  ctx.closePath();
}

function drawGlass() {
  ctx.beginPath();
  ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
  ctx.strokeStyle = "#000";
  ctx.stroke();
  ctx.closePath();
}

function updateBallPosition() {
  ballX += dx;
  ballY += dy;

  // Reflect at the glass walls
  const distanceFromCenter = Math.sqrt(Math.pow(ballX - centerX, 2) + Math.pow(ballY - centerY, 2));
  if (distanceFromCenter + ballRadius >= radius) {
    // Calculate the normal vector
    const nx = (ballX - centerX) / distanceFromCenter;
    const ny = (ballY - centerY) / distanceFromCenter;

    // Reflect the velocity vector
    const dotProduct = dx * nx + dy * ny;
    dx = dx - 2 * dotProduct * nx;
    dy = dy - 2 * dotProduct * ny;

    // Apply some damping (optional)
    dx *= 0.99;
    dy *= 0.99;
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGlass();
  drawBall();
  updateBallPosition();
  requestAnimationFrame(draw);
}

// Touch interaction
let lastX, lastY;
canvas.addEventListener('touchstart', (e) => {
  const touch = e.touches[0];
  lastX = touch.clientX;
  lastY = touch.clientY;
});

canvas.addEventListener('touchmove', (e) => {
  const touch = e.touches[0];
  const deltaX = touch.clientX - lastX;
  const deltaY = touch.clientY - lastY;
  lastX = touch.clientX;
  lastY = touch.clientY;
  
  // Apply the gesture movement to the ball's velocity
  dx += deltaX * 0.1;
  dy += deltaY * 0.1;
  e.preventDefault();
});

// Initialize the animation
ballX += Math.sin(angle) * radius * 0.8;
ballY += Math.cos(angle) * radius * 0.8;
draw();
</script>

</body>
</html>
